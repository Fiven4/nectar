name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk nectar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: nectar-apk
          path: nectar.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Нектар (APK)
          files: nectar.apk
          target_commitish: ${{ github.sha }}
